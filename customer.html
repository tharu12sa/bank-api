<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customer Dashboard</title>
        <link rel="stylesheet" href="style.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body class="d-flex flex-column min-vh-100 bdy">

        <div class="container my-4">
            <div class="row g-4">

                <div class="col-md-5">
                    <div class="profile-card">
                        <div class="profile-header">
                            <div class="avatar-large" id="cardAvatar">U</div>
                            <div class="profile-title">
                                <h2 id="carduserName">User Name</h2>
                                <span class="badge">Customer</span>
                            </div>
                        </div>
                        <div class="profile-body">
                            <div class="info-item">
                                <span class="label">Customer ID</span>
                                <span class="value" id="cardId">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Email Address</span>
                                <span class="value" id="cardEmail">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label">FullName</span>
                                <span class="value" id="cardName">-</span>
                            </div>
                        </div>
                    </div>
                </div>

    
                <div class="col-md-7">
                    <div
                        class="card h-100 p-4 border-0 rounded-4 shadow-sm text-white"
                        style="background: #111e25;">
                        <h3 class="fw-bold text-success">Apply For A Bank
                            Loan</h3>
                        <p class="text-light">කැමති ගානක් උබ ගනින්</p>
                        <div class="mt-auto">
                            <button
                                class="btn btn-success btn-lg w-100 fw-bold rounded-3"
                                data-bs-toggle="modal"
                                data-bs-target="#loanModal">
                                + Apply New Loan
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 2. යට කොටස: Applied Loans Table එක -->
            <div class="row mt-5">
                <div class="col-12">
                    <div class="card border-0 rounded-4 shadow-sm p-4"
                        style="background: #111e25; color: white;">
                        <h4 class="fw-bold mb-3 text-success">My Applied
                            Loans</h4>
                        <div class="table-responsive">
                            <table
                                class="table table-dark table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Loan ID</th>
                                        <th>Applied Date</th>
                                        <th>Amount (LKR)</th>
                                        <th>Duration</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="loanTableBody">
                                    <!-- JS හරහා dynamically data පිරේ -->
                                    <tr>
                                        <td colspan="5"
                                            class="text-center text-muted">No
                                            loan applications submitted
                                            yet.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. Modal Form Popup (Button එක Click කළාම එන Form එක) -->
        <div class="modal fade" id="loanModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div
                    class="modal-content bg-dark text-white rounded-4 border-secondary">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title fw-bold text-success">Loan
                            Application Form</h5>
                        <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="loanForm">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter fullname" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">NIC</label>
                                <input type="text" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter NIC" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Birthday</label>
                                <input type="date" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter Birthday" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter PhoneNumber" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter Address" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">City</label>
                                <input type="text" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter City" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">State</label>
                                <input type="text" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter State" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Zipcode</label>
                                <input type="text" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter Zipcode" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">AnnualIncome</label>
                                <input type="text" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter Address" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Loan Amount
                                    (LKR)</label>
                                <input type="number" id="loanAmount"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="e.g. 500000" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Duration
                                    (Months)</label>
                                <select id="loanDuration"
                                    class="form-select bg-secondary text-white border-0"
                                    required>
                                    <option value="6">6 Months</option>
                                    <option value="12">12 Months</option>
                                    <option value="24">24 Months</option>
                                    <option value="36">36 Months</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Reason for
                                    Loan</label>
                                <textarea id="loanPurpose"
                                    class="form-control bg-secondary text-white border-0"
                                    rows="3" placeholder="Brief explanation..."
                                    required></textarea>
                            </div>
                            <button type="submit"
                                class="btn btn-success w-100 fw-bold">Submit
                                Application</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS Bundle (Modal එක වැඩ කිරීමට අනිවාර්යයි) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>

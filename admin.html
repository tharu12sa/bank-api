<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body class="d-flex flex-column min-vh-100 bdy">
        <div class="container my-4">
            <div class="row mt-5">
            <div class="col-12">
                <div class="card border-0 rounded-4 shadow-sm p-4"
                    style="background: #111e25; color: white;">
                    <h4
                        class="fw-bold mb-3 text-success d-flex justify-content-between align-items-center">
                        All users
                        <input class="btn btn-info" type="button"
                            value="view user" onclick="ViewUsers()">
                    </h4>
                    <div class="table-responsive">
                        <table
                            class="table table-dark table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>UserName</th>
                                    <th>Password</th>
                                    <th>Role</th>
                                    <th>CreateDate</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="loanTableBody3">
                                <!-- JS හරහා dynamically data පිරේ -->
                                <tr>
                                    <td colspan="6"
                                        class="text-center text-muted">
                                        No loan applications submitted yet.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>

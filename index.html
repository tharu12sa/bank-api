<!DOCTYPE html>
<html lang="si">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>පොල්ල තියෙන බැංකුව</title>
        <!-- Bootstrap 5 CSS CDN -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <!-- Google Sinhala Font -->
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="d-flex flex-column min-vh-100 bdy">
        <!-- Navbar -->
        <nav
            class="navbar navbar-expand-lg navbar-dark bg-primary bg-gradient shadow-sm py-2">
            <div class="container">
                <!-- Bank Logo & Name -->
                <a
                    class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4"
                    href="#">
                    <span>🏦</span>
                    <span>පොල්ල තියෙන බැංකුව</span>
                </a>
                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                    <!-- Login & Register Buttons -->
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-light px-3"
                            type="button">ඇතුළු වන්න (Login)</button>
                        <button class="btn btn-warning fw-semibold px-3"
                            type="button">ලියාපදිංචි වන්න (Register)</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Bootstrap JS -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>

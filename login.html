<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="d-flex flex-column min-vh-100 bdy">
        <div
            class="container flex-grow-1 d-flex align-items-center justify-content-center py-4">
            <div class="card border-0 rounded-4 p-4 p-md-5 shadow-lg">
                <h3 class="fw-bold text-center mb-4">Login</h3>

                <form action>
                    

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="loginName"
                            class="form-label fw-semibold">User name</label>
                        <input type="text" class="form-control py-2"
                            id="loginName" placeholder="Enter username">
                    </div>

                    <!-- pass -->
                    <div class="mb-3">
                        <label for="loginPass"
                            class="form-label fw-semibold">Password</label>
                        <input type="text" class="form-control py-2"
                            id="loginpass" placeholder="Enter password">
                    </div>

                    <!-- Save Button -->
                    <div class="d-grid">
                        <button type="button"
                            class="btn btn-primary fw-semibold py-2" onclick="btnAddlogin()">
                            login
                        </button>
                    </div>
                </form>

            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="d-flex flex-column min-vh-100 bdy">
        <div
            class="container flex-grow-1 d-flex align-items-center justify-content-center py-4">
            <div class="card border-0 rounded-4 p-4 p-md-5 shadow-lg"
                style="max-width: 480px; width: 100%;">
                <h3 class="fw-bold text-center mb-4">Add Customer</h3>

                <form action>
                    <!-- Username -->
                    <div class="mb-3">
                        <label for="userName"
                            class="form-label fw-semibold">Userame</label>
                        <input type="text" class="form-control py-2"
                            id="userName" placeholder="Enter  Username">
                    </div>

                    <!-- email -->
                    <div class="mb-3">
                        <label for="email"
                            class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control py-2"
                            id="email" placeholder="Enter Email">
                    </div>

                    <!-- fullName -->
                    <div class="mb-3">
                        <label for="fullName"
                            class="form-label fw-semibold">Full name</label>
                        <input type="text" class="form-control py-2"
                            id="fullName" placeholder="Enter Full name">
                    </div>

                    <!-- password -->
                    <div class="mb-3">
                        <label for="pass"
                            class="form-label fw-semibold">Password</label>
                        <input type="text" class="form-control py-2"
                            id="pass" placeholder="Enter Password">
                    </div>

                    <!-- Save Button -->
                    <div class="d-grid">
                        <button type="button"
                            class="btn btn-primary fw-semibold py-2"
                            onclick="btnAddcustomer()">
                            Save Customer
                        </button>
                    </div>
                    <div class="text-danger">
                        <h6 id="fail"></h6>
                    </div>
                </form>

            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="d-flex flex-column min-vh-100 bdy">
        <div
            class="container flex-grow-1 d-flex align-items-center justify-content-center py-4">
            <div class="card border-0 rounded-4 p-4 p-md-5 shadow-lg"
                style="max-width: 480px; width: 100%;">
                <h3 class="fw-bold text-center mb-4">Add Customer</h3>

                <form action>
                    <!-- Customer ID -->
                    <div class="mb-3">
                        <label for="customerId"
                            class="form-label fw-semibold">Customer ID</label>
                        <input type="text" class="form-control py-2"
                            id="customerId" placeholder="Enter ID (e.g. C001)">
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="userName"
                            class="form-label fw-semibold">Userame</label>
                        <input type="text" class="form-control py-2"
                            id="userName" placeholder="Enter  Username">
                    </div>

                    <!-- email -->
                    <div class="mb-3">
                        <label for="email"
                            class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control py-2"
                            id="email" placeholder="Enter Email">
                    </div>

                    <!-- fullName -->
                    <div class="mb-3">
                        <label for="customerName"
                            class="form-label fw-semibold">Fullname</label>
                        <input type="text" class="form-control py-2"
                            id="customerName" placeholder="Enter address">
                    </div>

                    <!-- Save Button -->
                    <div class="d-grid">
                        <button type="button"
                            class="btn btn-primary fw-semibold py-2" onclick="btnAddcustomer()">
                            Save Customer
                        </button>
                    </div>
                </form>

            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
